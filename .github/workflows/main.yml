name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install ldid
        run: brew install ldid

      - name: Build Application Payload
        run: |
          mkdir -p build
          xcodebuild build \
            -project FrostFold.xcodeproj \
            -scheme FrostFold \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            BUILD_DIR=build

      - name: Lower MinimumOSVersion in Info.plist
        run: |
          PLIST="build/Release-iphoneos/FrostFold.app/Info.plist"
          plutil -replace MinimumOSVersion -string "16.0" "$PLIST"

      - name: Generate Entitlements & Sign with ldid
        run: |
          cat <<EOF > entitlements.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>get-task-allow</key>
              <true/>
          </dict>
          </plist>
          EOF
          ldid -Sentitlements.plist build/Release-iphoneos/FrostFold.app/FrostFold

      - name: Package into IPA
        run: |
          mkdir -p Payload
          cp -r build/Release-iphoneos/FrostFold.app Payload/
          zip -r FrostFold.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FrostFold-IPA
          path: FrostFold.ipa
